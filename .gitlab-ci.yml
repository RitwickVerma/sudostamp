# SudoStamp CI (the owner's self-hosted runner; GitLab.com shared runners are not used)
#
# CI NEVER SIGNS. The release key and the installer key are decrypted only on the
# maintainer's machine, into tmpfs, by scripts/release.sh (docs/RELEASING.md). The runner is
# shared with other projects and runs unprotected branches, and GitLab passes protected
# variables to every job of a protected ref, not only to the one that needs them -- so a
# signing key in CI variables would have been one compromised image away from leaking.
#
# Jobs use the Gradle wrapper (pinned to 9.3.1) and install the Android SDK from
# Google cmdline-tools into ANDROID_HOME (cached), so CI never depends on a
# machine-local JDK or SDK path. The local-only JDK path lives in
# ~/.gradle/gradle.properties and the SDK path in local.properties, both outside
# the repo.
#
# What CI proves, and why these jobs and not others: the whole security claim of
# this project rests on the two SSH wire blobs (public key blob, signature blob)
# being byte-correct, because a wrong encoding produces signatures that look fine
# and simply fail to verify at the sudo prompt. So the unit tests (job `android`) are followed
# in the same job by tools/verify_ssh_sig.py, which checks those blobs with tools
# that are NOT this project's code (OpenSSH + the independent `cryptography`
# library). Unit tests alone can assert structure and still pass on bytes no SSH
# implementation accepts -- see tools/verify_ssh_sig.py.
#
# Runner cost: the unit tests, lint and the debug build are ONE Gradle invocation (job `android`), so
# the project is configured and compiled once instead of three times in three JVMs, and the Gradle +
# SDK cache is shared by every branch (keyed by the wrapper, the dependency lock and the SDK pins)
# instead of starting cold on each new branch.

stages:
  - test
  - verify

# Branch, tag and schedule pipelines only. Jobs with explicit `rules` (below, and the SAST template)
# would otherwise also start a merge-request pipeline for every push -- a second full run on the
# one shared runner, without CI_COMMIT_BRANCH, so `release-check` skipped itself there.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

# Static analysis: GitLab's own SAST template (free tier), which runs its Semgrep-based analyzer
# over the Kotlin, Python and shell here. On the free tier its report is only an artifact and
# never fails a pipeline, so `sast-gate` below does: any High or Critical finding stops it.
include:
  - template: Jobs/SAST.gitlab-ci.yml


variables:
  SAST_EXCLUDED_PATHS: "app/build, build, .gradle, android-sdk, docs, fastlane"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  SDK_PLATFORM: "36"
  SDK_BUILD_TOOLS: "36.0.0"
  CMDLINE_TOOLS_VERSION: "11076708"

image: eclipse-temurin:17-jdk

# Every job runs on the self-hosted runner tagged `local` (docker executor): the shared
# runners' free minutes ran out on the first pipelines (ci_quota_exceeded). The runner must
# be enabled for this project (Settings > CI/CD > Runners) or jobs wait forever.
default:
  tags: [local]
  interruptible: true

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/verification-metadata.xml
    prefix: "sdk$SDK_PLATFORM-$SDK_BUILD_TOOLS"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/modules-2/
    - android-sdk/

.sdk_setup:
  before_script:
    - bash scripts/ci-setup-sdk.sh

# Pipeline schedules run only `channels` (at the end); every other job is for pushes and tags.
.not_scheduled:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# Unit tests, lint and the debug APK in one Gradle run (--continue: a lint failure still reports
# the test results and vice versa). The unit test `emit artifacts for external verification`
# leaves app/build/sshcheck/ behind (test.pub, msg.bin, sig.bin); those bytes are then checked
# with independent tools: OpenSSH must parse the public key blob, and `cryptography` must verify
# the ECDSA signature (plus the two negative controls). This is gate 2 of tools/verify.sh.
android:
  stage: test
  extends: [.sdk_setup, .not_scheduled]
  script:
    # Includes the *FuzzTest property tests of the JVM parsers (AgentProtocol, SshSig, Net, Pairing):
    # seeded, a few seconds. -Dsudostamp.fuzz.iterations=N scales them for a long run.
    - ./gradlew --no-daemon --continue -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 testDebugUnitTest lintDebug assembleDebug
    # DEBIAN_FRONTEND=noninteractive keeps debconf from spraying noise into the job log.
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client python3 python3-cryptography >/dev/null
    - python3 tools/verify_ssh_sig.py app/build/sshcheck
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    paths:
      - app/build/reports/
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week

# Repo hygiene that needs no SDK: no credential-shaped content in any tracked file (GitLab's
# server-side secret push protection is not on the free tier), the shell scripts that run
# as root on the host pass shellcheck, and the Python tools at least compile.
hygiene:
  stage: test
  extends: .not_scheduled
  image: debian:stable-slim
  cache: []
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git python3 python3-cryptography openssl shellcheck >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 tools/check-secrets.py --all
    # Every script the docs tell people to run directly must be executable in git: a mode of
    # 100644 gives "command not found" on the very first command a user types.
    # (if/fi, not &&-chains: the job runs under `set -e`, and a loop whose last test is false
    # would otherwise abort the job silently.)
    - 'bad=$(git ls-files -s tools scripts | while read -r mode _ _ f; do if head -c2 "$f" | grep -q "#!" && [ "$mode" != 100755 ]; then echo "$f"; fi; done); test -z "$bad" || { echo "not executable in git:" $bad >&2; exit 1; }'
    - shellcheck -S warning tools/*.sh tools/test/*.sh scripts/*.sh
    - python3 -m py_compile tools/*.py tools/test/*.py && rm -rf tools/__pycache__ tools/test/__pycache__
    - python3 -I tools/test/test_pair.py && rm -rf tools/test/__pycache__ tools/__pycache__
    - python3 -I tools/test/test_attest.py && rm -rf tools/test/__pycache__ tools/__pycache__
    # Fuzz and property tests of pair.py's parsers and of install.sh's --phone check: seeded, stdlib
    # only, about 10 s. SUDOSTAMP_FUZZ_ITERATIONS=2000000 for a long local run.
    - python3 -I tools/test/test_fuzz_pair.py && rm -rf tools/test/__pycache__ tools/__pycache__
    # The SBOM generator (scripts/sbom.py): CycloneDX 1.5 shape, what the APK and installer SBOMs
    # must say, and -- online, here only -- that pam_rssh's Cargo.lock at the commit tools/install.sh
    # pins is still the file whose SHA-256 sbom.py pins.
    - SUDOSTAMP_ONLINE=1 python3 -I tools/test/test_sbom.py && rm -rf tools/test/__pycache__ tools/__pycache__

# The host side, end to end, on every supported Linux family: tools/install.sh installs
# pam_rssh (packaged or built from the pinned commit), pins the key of a mock phone
# (tools/test/mock_agent.py, a software key on loopback), and then a REAL sudo must
# succeed with no password while the phone approves, fall back to the password when it
# denies, and be restored byte for byte by rollback. Each image is a fresh root container,
# which is what the test needs: it rewrites /etc/pam.d/sudo.
host-e2e:
  stage: test
  extends: .not_scheduled
  image: $IMAGE
  cache: []
  before_script: []
  parallel:
    matrix:
      - IMAGE:
          - debian:trixie
          - debian:bookworm
          - ubuntu:24.04
          - registry.fedoraproject.org/fedora:latest
          - rockylinux/rockylinux:9
          - registry.opensuse.org/opensuse/tumbleweed:latest
          - archlinux:latest
  script:
    - SUDOSTAMP_SRC="$CI_PROJECT_DIR" bash tools/test/e2e.sh

# Secrets in any commit ever pushed, not just the current tree (check-secrets.py scans the tree).
gitleaks:
  stage: test
  extends: .not_scheduled
  image:
    name: docker.io/zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854   # v8.28.0
    entrypoint: [""]
  cache: []
  variables:
    GIT_DEPTH: 0
  script:
    # HEAD only: `gitleaks git` scans every ref in the checkout, and the runner reuses build
    # directories, so refs fetched by another branch's job got scanned here too (master pipeline
    # 3059201575 failed on test fixtures that exist only on upgrade/attestation).
    - gitleaks git . --redact --no-banner --log-opts=HEAD

# ---------------------------------------------------------------- releases
# docs/RELEASING.md. CI never signs and never publishes: the release key, the installer key and the
# store credentials stay on the maintainer's machine, where `scripts/release.sh ship X.Y.Z` tags the
# merged release, waits for this pipeline on the tag, signs, publishes to every channel (GitLab,
# AUR, Google Play) and checks them. What CI adds: every check on the tag, and the daily `channels`
# job, which fails -- GitLab's failure email is the alert -- whenever a channel is behind.

.release_tag: &release_tag
  if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# Versions, store notes, dated changelog, listing: seconds, so a tag on the wrong commit fails
# before anything slow starts. Also on release/* branches, so the merge request shows it.
release-check:
  stage: test
  image: alpine:3.20
  cache: []
  before_script: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - *release_tag
    - if: '$CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - apk add --no-cache bash git >/dev/null
    - 'if [ -n "$CI_COMMIT_TAG" ]; then V="${CI_COMMIT_TAG#v}"; else V="${CI_COMMIT_BRANCH#release/}"; fi'
    - scripts/release-check.sh "$V"

# The supply-chain proof: rebuild the published APK from its tag and compare bytes. No secret is
# involved: the build is unsigned, the published signature is copied onto it (apksigcopier), and the
# result must equal what everyone downloads (scripts/verify-reproducible.sh, docs/RELEASING.md).
#
# WHY MANUAL ON A TAG, and not an automatic job that waits for the Release: `release.sh ship` waits for
# the tag pipeline to succeed BEFORE it publishes, and a pipeline with a job still waiting for the Release
# is never "success" -- the two would wait on each other. A non-blocking manual job leaves the pipeline
# green; `ship` plays it once the Release exists (scripts/run-ci-job.sh) and fails the release if the
# rebuild differs. The wait loop (up to 60 minutes) is still there for whoever starts it from the page
# straight after tagging. Also: on master (manual, for testing; REPRO_VERSION picks a version, else the
# newest tag) and on a pipeline schedule that sets CHECK_REPRODUCIBLE=1, which re-proves the newest tag
# periodically: a moved builder image or a changed dependency breaks reproducibility silently otherwise.
reproducible:
  stage: verify
  extends: .sdk_setup
  needs: []
  timeout: 2h
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CHECK_REPRODUCIBLE == "1"'
    - <<: *release_tag
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git openssh-client python3 python3-venv >/dev/null
    # apksigcopier and its one dependency (click), each pinned by hash: the one tool of this check that is not ours.
    - python3 -m venv /opt/verify-venv && /opt/verify-venv/bin/pip install -q --require-hashes -r scripts/requirements-reproducible.txt
    - export PATH="/opt/verify-venv/bin:$PATH"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - 'if [ -n "$CI_COMMIT_TAG" ]; then V="${CI_COMMIT_TAG#v}"; elif [ -n "$REPRO_VERSION" ]; then V="$REPRO_VERSION"; else V=$(git tag -l "v[0-9]*" --sort=-v:refname | head -1); V="${V#v}"; fi'
    - 'echo "verifying v$V"'
    - VERIFY_WAIT_MINUTES=60 VERIFY_RELEASE_FILES=1 scripts/verify-reproducible.sh "$V"

sast-gate:
  stage: test
  extends: .not_scheduled
  image: python:3.12-slim
  cache: []
  before_script: []
  needs:
    - job: semgrep-sast
      artifacts: true
  script:
    - |
      python3 - <<'PY'
      import json, sys
      try:
          findings = json.load(open("gl-sast-report.json")).get("vulnerabilities", [])
      except FileNotFoundError:
          sys.exit("no gl-sast-report.json: the analyzer did not run")
      for f in findings:
          loc = f.get("location", {})
          print("%-8s %s:%s  %s" % (f.get("severity"), loc.get("file"), loc.get("start_line"), f.get("name")))
      bad = [f for f in findings if f.get("severity") in ("Critical", "High")]
      print("%d finding(s), %d high or critical" % (len(findings), len(bad)))
      sys.exit(1 if bad else 0)
      PY

# GitLab's SAST template job: not on schedules either (its own rules are replaced here). No cache:
# it inherited the top-level Gradle/SDK cache and saved an empty archive under the same key, which
# can overwrite the 1.5 GB cache `android` just saved (it showed as `Failed to extract cache`).
semgrep-sast:
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

# Every channel serves the newest tagged release (scripts/check-channels.sh). Runs from a daily
# pipeline schedule on master; silent when everything is in step, a failed pipeline when not.
channels:
  stage: test
  image: debian:stable-slim
  cache: []
  before_script: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bash ca-certificates curl git openssh-client >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - V=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
    - echo "newest tag $V"
    - scripts/check-channels.sh "${V#v}"
