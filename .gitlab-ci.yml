# SudoStamp CI (GitLab.com shared runners)
#
# Jobs use the Gradle wrapper (pinned to 9.3.1) and install the Android SDK from
# Google cmdline-tools into ANDROID_HOME (cached), so CI never depends on a
# machine-local JDK or SDK path. The local-only JDK path lives in
# ~/.gradle/gradle.properties and the SDK path in local.properties, both outside
# the repo.
#
# What CI proves, and why these jobs and not others: the whole security claim of
# this project rests on the two SSH wire blobs (public key blob, signature blob)
# being byte-correct, because a wrong encoding produces signatures that look fine
# and simply fail to verify at the sudo prompt. So the unit-test job is followed
# in the same job by tools/verify_ssh_sig.py, which checks those blobs with tools
# that are NOT this project's code (OpenSSH + the independent `cryptography`
# library). Unit tests alone can assert structure and still pass on bytes no SSH
# implementation accepts -- see tools/verify_ssh_sig.py.

stages:
  - test
  - build

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  SDK_PLATFORM: "36"
  SDK_BUILD_TOOLS: "36.0.0"
  CMDLINE_TOOLS_VERSION: "11076708"

image: eclipse-temurin:17-jdk

# Every job runs on the self-hosted runner tagged `local` (docker executor): the shared
# runners' free minutes ran out on the first pipelines (ci_quota_exceeded). The runner must
# be enabled for this project (Settings > CI/CD > Runners) or jobs wait forever.
default:
  tags: [local]

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/modules-2/
    - android-sdk/

.sdk_setup: &sdk_setup
  before_script:
    - bash scripts/ci-setup-sdk.sh

unit-test:
  stage: test
  <<: *sdk_setup
  script:
    - ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 testDebugUnitTest
    # The unit test `emit artifacts for external verification` leaves app/build/sshcheck/
    # behind (test.pub, msg.bin, sig.bin). Check those bytes with independent tools:
    # OpenSSH must parse the public key blob, and `cryptography` must verify the ECDSA
    # signature (plus the two negative controls). This is gate 2 of tools/verify.sh.
    # DEBIAN_FRONTEND=noninteractive keeps debconf from spraying noise into the job log.
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client python3 python3-cryptography >/dev/null
    - python3 tools/verify_ssh_sig.py app/build/sshcheck
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    paths:
      - app/build/reports/tests/
    expire_in: 1 week

# Repo hygiene that needs no SDK: no credential-shaped content in any tracked file (GitLab's
# server-side secret push protection is not on the free tier), the shell scripts that run
# as root on the host pass shellcheck, and the Python tools at least compile.
hygiene:
  stage: test
  image: debian:stable-slim
  cache: []
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git python3 shellcheck >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 tools/check-secrets.py --all
    # Every script the docs tell people to run directly must be executable in git: a mode of
    # 100644 gives "command not found" on the very first command a user types.
    - 'bad=$(git ls-files -s tools scripts | while read -r mode _ _ f; do head -c2 "$f" | grep -q "#!" && [ "$mode" != 100755 ] && echo "$f"; done); test -z "$bad" || { echo "not executable in git:" $bad >&2; exit 1; }'
    - shellcheck -S warning tools/*.sh tools/test/*.sh scripts/*.sh
    - python3 -m py_compile tools/*.py tools/test/*.py && rm -rf tools/__pycache__ tools/test/__pycache__

# The host side, end to end, on every supported Linux family: tools/install.sh installs
# pam_rssh (packaged or built from the pinned commit), pins the key of a mock phone
# (tools/test/mock_agent.py, a software key on loopback), and then a REAL sudo must
# succeed with no password while the phone approves, fall back to the password when it
# denies, and be restored byte for byte by rollback. Each image is a fresh root container,
# which is what the test needs: it rewrites /etc/pam.d/sudo.
host-e2e:
  stage: test
  image: $IMAGE
  cache: []
  before_script: []
  parallel:
    matrix:
      - IMAGE:
          - debian:trixie
          - debian:bookworm
          - ubuntu:24.04
          - registry.fedoraproject.org/fedora:latest
          - rockylinux/rockylinux:9
          - registry.opensuse.org/opensuse/tumbleweed:latest
          - archlinux:latest
  script:
    - SUDOSTAMP_SRC="$CI_PROJECT_DIR" bash tools/test/e2e.sh

lint:
  stage: test
  <<: *sdk_setup
  script:
    - ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 lintDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/
    expire_in: 1 week

assemble-debug:
  stage: build
  <<: *sdk_setup
  script:
    - ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week

# ---------------------------------------------------------------- releases
# Pushing a tag `vX.Y.Z` builds a SIGNED release APK and publishes it with its checksum.
# The signing key is four CI/CD variables (Settings > CI/CD > Variables), all Masked and
# Protected, and the tag pattern is a Protected tag, so only a maintainer's tag can reach
# them. docs/RELEASING.md has the one-time setup.
build-release:
  stage: build
  # Pinned by digest, not by tag: this job holds the release signing key, and a floating tag
  # means trusting whatever the image's publisher pushes next. Bump deliberately.
  image: eclipse-temurin:17-jdk@sha256:420933bf319e6aff4bec22eff8d2a31c824df5d853432e3dc0f46d6ea8dd5919
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  <<: *sdk_setup
  script:
    - 'test -n "$SUDOSTAMP_KEYSTORE_B64" || { echo "SUDOSTAMP_KEYSTORE_B64 is not set (see docs/RELEASING.md)" >&2; exit 1; }'
    # The tag must match what the app says it is, or the APK would lie about its version.
    - ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
    - 'test "v$ver" = "$CI_COMMIT_TAG" || { echo "tag $CI_COMMIT_TAG does not match versionName v$ver" >&2; exit 1; }'
    - export SUDOSTAMP_KEYSTORE="$CI_PROJECT_DIR/release.jks"
    - echo "$SUDOSTAMP_KEYSTORE_B64" | base64 -d > "$SUDOSTAMP_KEYSTORE"
    - ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 assembleRelease
    - rm -f "$SUDOSTAMP_KEYSTORE"
    - apk="app/build/outputs/apk/release/app-release.apk"
    - "$ANDROID_HOME/build-tools/$SDK_BUILD_TOOLS/apksigner verify --print-certs \"$apk\" | tee signer.txt"
    - mkdir -p dist
    - cp "$apk" "dist/sudostamp-$CI_COMMIT_TAG.apk"
    # Needed to decode a release stack trace (R8 renames classes): keep it with the release.
    - cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$CI_COMMIT_TAG.txt"
    - (cd dist && sha256sum "sudostamp-$CI_COMMIT_TAG.apk" > "sudostamp-$CI_COMMIT_TAG.apk.sha256" && cat "sudostamp-$CI_COMMIT_TAG.apk.sha256")
  artifacts:
    paths:
      - dist/
      - signer.txt

publish-release:
  stage: .post
  # Pinned (v0.24.0 by digest): it receives the job token that creates the Release.
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  needs: [build-release]
  cache: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "publishing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "SudoStamp $CI_COMMIT_TAG"
    description: "Signed release APK. Verify with the .sha256 file, then see the README for setup. If you are upgrading from a debug build you must uninstall first (the signing key differs), which destroys the old key: see docs/RELEASING.md."
    assets:
      links:
        - name: "sudostamp-$CI_COMMIT_TAG.apk"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/sudostamp-$CI_COMMIT_TAG.apk?job=build-release"
          link_type: package
        - name: "mapping-$CI_COMMIT_TAG.txt"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/mapping-$CI_COMMIT_TAG.txt?job=build-release"
          link_type: other
        - name: "sudostamp-$CI_COMMIT_TAG.apk.sha256"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/sudostamp-$CI_COMMIT_TAG.apk.sha256?job=build-release"
          link_type: other
