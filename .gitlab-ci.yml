# SudoStamp CI (the owner's self-hosted runner; GitLab.com shared runners are not used)
#
# CI NEVER SIGNS. The release key and the installer key are decrypted only on the
# maintainer's machine, into tmpfs, by scripts/release.sh (docs/RELEASING.md). The runner is
# shared with other projects and runs unprotected branches, and GitLab passes protected
# variables to every job of a protected ref, not only to the one that needs them -- so a
# signing key in CI variables would have been one compromised image away from leaking.
#
# Jobs use the Gradle wrapper (pinned to 9.3.1) and install the Android SDK from
# Google cmdline-tools into ANDROID_HOME (cached), so CI never depends on a
# machine-local JDK or SDK path. The local-only JDK path lives in
# ~/.gradle/gradle.properties and the SDK path in local.properties, both outside
# the repo.
#
# What CI proves, and why these jobs and not others: the whole security claim of
# this project rests on the two SSH wire blobs (public key blob, signature blob)
# being byte-correct, because a wrong encoding produces signatures that look fine
# and simply fail to verify at the sudo prompt. So the unit-test job is followed
# in the same job by tools/verify_ssh_sig.py, which checks those blobs with tools
# that are NOT this project's code (OpenSSH + the independent `cryptography`
# library). Unit tests alone can assert structure and still pass on bytes no SSH
# implementation accepts -- see tools/verify_ssh_sig.py.

stages:
  - test
  - build

# Static analysis: GitLab's own SAST template (free tier), which runs its Semgrep-based analyzer
# over the Kotlin, Python and shell here. On the free tier its report is only an artifact and
# never fails a pipeline, so `sast-gate` below does: any High or Critical finding stops it.
include:
  - template: Jobs/SAST.gitlab-ci.yml


variables:
  SAST_EXCLUDED_PATHS: "app/build, build, .gradle, android-sdk, docs, fastlane"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  SDK_PLATFORM: "36"
  SDK_BUILD_TOOLS: "36.0.0"
  CMDLINE_TOOLS_VERSION: "11076708"

image: eclipse-temurin:17-jdk

# Every job runs on the self-hosted runner tagged `local` (docker executor): the shared
# runners' free minutes ran out on the first pipelines (ci_quota_exceeded). The runner must
# be enabled for this project (Settings > CI/CD > Runners) or jobs wait forever.
default:
  tags: [local]

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/modules-2/
    - android-sdk/

.sdk_setup: &sdk_setup
  before_script:
    - bash scripts/ci-setup-sdk.sh

unit-test:
  stage: test
  <<: *sdk_setup
  script:
    - ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 testDebugUnitTest
    # The unit test `emit artifacts for external verification` leaves app/build/sshcheck/
    # behind (test.pub, msg.bin, sig.bin). Check those bytes with independent tools:
    # OpenSSH must parse the public key blob, and `cryptography` must verify the ECDSA
    # signature (plus the two negative controls). This is gate 2 of tools/verify.sh.
    # DEBIAN_FRONTEND=noninteractive keeps debconf from spraying noise into the job log.
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client python3 python3-cryptography >/dev/null
    - python3 tools/verify_ssh_sig.py app/build/sshcheck
  artifacts:
    when: always
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    paths:
      - app/build/reports/tests/
    expire_in: 1 week

# Repo hygiene that needs no SDK: no credential-shaped content in any tracked file (GitLab's
# server-side secret push protection is not on the free tier), the shell scripts that run
# as root on the host pass shellcheck, and the Python tools at least compile.
hygiene:
  stage: test
  image: debian:stable-slim
  cache: []
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git python3 shellcheck >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 tools/check-secrets.py --all
    # Every script the docs tell people to run directly must be executable in git: a mode of
    # 100644 gives "command not found" on the very first command a user types.
    # (if/fi, not &&-chains: the job runs under `set -e`, and a loop whose last test is false
    # would otherwise abort the job silently.)
    - 'bad=$(git ls-files -s tools scripts | while read -r mode _ _ f; do if head -c2 "$f" | grep -q "#!" && [ "$mode" != 100755 ]; then echo "$f"; fi; done); test -z "$bad" || { echo "not executable in git:" $bad >&2; exit 1; }'
    - shellcheck -S warning tools/*.sh tools/test/*.sh scripts/*.sh
    - python3 -m py_compile tools/*.py tools/test/*.py && rm -rf tools/__pycache__ tools/test/__pycache__
    - python3 -I tools/test/test_pair.py && rm -rf tools/test/__pycache__ tools/__pycache__

# The host side, end to end, on every supported Linux family: tools/install.sh installs
# pam_rssh (packaged or built from the pinned commit), pins the key of a mock phone
# (tools/test/mock_agent.py, a software key on loopback), and then a REAL sudo must
# succeed with no password while the phone approves, fall back to the password when it
# denies, and be restored byte for byte by rollback. Each image is a fresh root container,
# which is what the test needs: it rewrites /etc/pam.d/sudo.
host-e2e:
  stage: test
  image: $IMAGE
  cache: []
  before_script: []
  parallel:
    matrix:
      - IMAGE:
          - debian:trixie
          - debian:bookworm
          - ubuntu:24.04
          - registry.fedoraproject.org/fedora:latest
          - rockylinux/rockylinux:9
          - registry.opensuse.org/opensuse/tumbleweed:latest
          - archlinux:latest
  script:
    - SUDOSTAMP_SRC="$CI_PROJECT_DIR" bash tools/test/e2e.sh

# Secrets in any commit ever pushed, not just the current tree (check-secrets.py scans the tree).
gitleaks:
  stage: test
  image:
    name: docker.io/zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854   # v8.28.0
    entrypoint: [""]
  cache: []
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git . --redact --no-banner

lint:
  stage: test
  <<: *sdk_setup
  script:
    - ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 lintDebug
  artifacts:
    when: always
    paths:
      - app/build/reports/
    expire_in: 1 week

assemble-debug:
  stage: build
  <<: *sdk_setup
  script:
    - ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week

# ---------------------------------------------------------------- releases
# docs/RELEASING.md. A release is: scripts/release.sh prepare X.Y.Z (release branch + merge request),
# the owner merges it and pushes tag vX.Y.Z on the merge commit. The tag pipeline then runs every
# check above plus `release-check`, and waits: `package` is MANUAL, so the signing key is used only
# when a person clicks it. `package` signs (key from the SOPS vault, opened by a protected File
# variable only v* tags receive), verifies the certificate, and uploads the APK, the single-file
# host installer, mapping.txt and SHA256SUMS to the generic package registry (permanent); then
# `publish-release` creates the GitLab Release linking them, so
#   https://gitlab.com/ritwick7/sudostamp/-/releases/permalink/latest/downloads/sudostamp-setup.sh
# always serves the newest installer.

.release_tag: &release_tag
  if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# Versions, store notes, dated changelog, listing: seconds, so a tag on the wrong commit fails
# before anything slow starts. Also on release/* branches, so the merge request shows it.
release-check:
  stage: test
  image: alpine:3.20
  cache: []
  before_script: []
  variables:
    GIT_DEPTH: 0
  rules:
    - *release_tag
    - if: '$CI_COMMIT_BRANCH =~ /^release\/[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - apk add --no-cache bash git >/dev/null
    - 'if [ -n "$CI_COMMIT_TAG" ]; then V="${CI_COMMIT_TAG#v}"; else V="${CI_COMMIT_BRANCH#release/}"; fi'
    - scripts/release-check.sh "$V"

sast-gate:
  stage: test
  image: python:3.12-slim
  cache: []
  before_script: []
  needs:
    - job: semgrep-sast
      artifacts: true
  script:
    - |
      python3 - <<'PY'
      import json, sys
      try:
          findings = json.load(open("gl-sast-report.json")).get("vulnerabilities", [])
      except FileNotFoundError:
          sys.exit("no gl-sast-report.json: the analyzer did not run")
      for f in findings:
          loc = f.get("location", {})
          print("%-8s %s:%s  %s" % (f.get("severity"), loc.get("file"), loc.get("start_line"), f.get("name")))
      bad = [f for f in findings if f.get("severity") in ("Critical", "High")]
      print("%d finding(s), %d high or critical" % (len(findings), len(bad)))
      sys.exit(1 if bad else 0)
      PY
